[build-system]
requires = ["setuptools>=61.0", "cmake", "nanobind", "wheel", "pip", "ninja"]
build-backend = "setuptools.build_meta"

[project]
name = "ttl"
description = "Python Bindings and Package for TT-Lang Compiler Project"
requires-python = ">=3.11"
keywords = ["mlir", "tt-lang", "tt-mlir", "tenstorrent", "compiler", "dsl", "kernel"]
license = "Apache-2.0"
license-files = ["LICENSE*"]
authors = [
  {name = "Tenstorrent AI ULC"}
]
maintainers = [
  {name = "Tenstorrent AI ULC"}
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: C++",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Compilers",
  "Topic :: Software Development :: Code Generators"
]

# We will dynamically provide `version` and `dependencies` in setup.py
dynamic = ["version", "dependencies", "readme"]

[tool.setuptools.dynamic]
readme = {file = "README.md"}


[project.urls]
Homepage = "https://github.com/tenstorrent/tt-lang"
Repository = "https://github.com/tenstorrent/tt-lang"
Issues = "https://github.com/tenstorrent/tt-lang/issues"

[tool.cibuildwheel]
build = "cp311-manylinux_x86_64*"
skip = "*-musllinux_*"
build-verbosity = 2

[tool.ruff]
line-length = 88
# Latest Python version Ruff supports; drives pyupgrade and version-aware rules.
target-version = "py313"
src = ["python", "examples", "test", "apps"]
# E/W = pycodestyle errors/warnings, F = pyflakes, I = isort, N = pep8-naming,
# UP = pyupgrade, B = flake8-bugbear, C4 = flake8-comprehensions, SIM = flake8-simplify.
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"python/ttl/dialects/*" = ["F401"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
mypy_path = "python"
check_untyped_defs = false
disallow_incomplete_defs = false
# Check ttl package via pre-commit: mypy -p ttl

[[tool.mypy.overrides]]
module = ["ttmlir.*", "ttnn.*", "ttnn"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["ttl._mlir_libs.*", "ttl._generated_elementwise", "ttl.config", "ttl.dialects._ttl_enum_gen", "ttl.dialects._ttl_ops_gen", "sympy.*", "setuptools.*", "yaml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["ttl.utils.*"]
ignore_missing_imports = true

[tool.pyright]
typeCheckingMode = "strict"
extraPaths = ["examples"]
reportMissingParameterType = "error"
reportMissingTypeStubs = "warning"
reportMissingImports = "error"
reportUnknownParameterType = "error"
reportUnknownArgumentType = "error"
reportUnknownVariableType = "error"
reportUnknownMemberType = "error"
reportUntypedFunctionDecorator = "error"
reportPrivateUsage = "error"
reportImportCycles = "error"
reportUnnecessaryIsInstance = "warning"

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
